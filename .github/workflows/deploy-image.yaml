name: deploy-image
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - build-latest
    branches:
      - develop
    types:
      - completed
jobs:
  deploy-image:
    runs-on: ubuntu-latest
    #timeout-minutes: 30
    if: |
      github.actor != 'dependabot[bot]' &&
      !(
        contains(github.event.pull_request.title, '[skip-release]') ||
        contains(github.event.comment.body, '/skiprelease')
      ) && github.event.workflow_run.conclusion == 'success'
    env:
      latest-ref: refs/heads/develop
    strategy:
      matrix:
        postgresMajorVersion:
          - 18
        postgresMajorVersionBugFix:
          - 1
        postgisMajorVersion:
          - 3
        postgisMinorRelease:
          - 6
        PatchMajorVersionBugs:
          - false
        imageVersion:
          - imageDistro: debian
            imageDistroVersion: trixie
            imageDistroVariant: slim
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Get Current Date
        id: current_date
        run: echo "formatted=$(date -u +%Y.%m.%d)" >> $GITHUB_OUTPUT

      - name: Check if image exists on Docker Hub
        id: check_hub_image_exists
        shell: bash
        run: |
          set -e
          
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            https://hub.docker.com/v2/repositories/kartoza/postgis/tags/${{ matrix.postgresMajorVersion }}-${{ matrix.postgisMajorVersion }}.${{ matrix.postgisMinorRelease }}/
          )
          
          echo "check_image=$status" >> "$GITHUB_OUTPUT"

      - name: Check if PostgreSQL image exists on Docker Hub
        id: check_pgversion_image_exists
        shell: bash
        run: |
          set -e
          
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            https://hub.docker.com/v2/repositories/kartoza/postgis/tags/${{ matrix.postgresMajorVersion }}.${{ matrix.postgresMajorVersionBugFix }}-${{ matrix.postgisMajorVersion }}.${{ matrix.postgisMinorRelease }}/
          )
          
          echo "check_pg_image=$status" >> "$GITHUB_OUTPUT"

      - name: Prepare tags
        id: prep_tags
        run: |
          TAGS="${{ secrets.DOCKERHUB_REPO }}/postgis"
      
          # Always push dated tag
          TAGS="$TAGS,${{ secrets.DOCKERHUB_REPO }}/postgis:${{ matrix.postgresMajorVersion }}-${{ matrix.postgisMajorVersion }}.${{ matrix.postgisMinorRelease }}--v${{ steps.current_date.outputs.formatted }}"
      
          # Condition 1: major version tag (18-3.6)
          if [ "${{ steps.check_hub_image_exists.outputs.check_image }}" != "200" ] || [ "${{ matrix.PatchMajorVersionBugs }}" = "true" ]; then
            TAGS="$TAGS,${{ secrets.DOCKERHUB_REPO }}/postgis:${{ matrix.postgresMajorVersion }}-${{ matrix.postgisMajorVersion }}.${{ matrix.postgisMinorRelease }}"
          fi
      
          # Condition 2: patch version tag (18.1-3.6)
          if [ "${{ steps.check_pgversion_image_exists.outputs.check_pg_image }}" != "200" ] || [ "${{ matrix.PatchMajorVersionBugs }}" = "true" ]; then
            TAGS="$TAGS,${{ secrets.DOCKERHUB_REPO }}/postgis:${{ matrix.postgresMajorVersion }}.${{ matrix.postgresMajorVersionBugFix }}-${{ matrix.postgisMajorVersion }}.${{ matrix.postgisMinorRelease }}"
          fi
      
          echo "tags=$TAGS" >> $GITHUB_OUTPUT


      - name: Build prod image
        id: docker_build_prod
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: Dockerfile
          push: true
          tags: ${{ steps.prep_tags.outputs.tags }}
          build-args: |
            DISTRO=${{ matrix.imageVersion.imageDistro }}
            IMAGE_VERSION=${{ matrix.imageVersion.imageDistroVersion }}
            IMAGE_VARIANT=${{ matrix.imageVersion.imageDistroVariant }}
            GENERATE_ALL_LOCALE=1
            POSTGRES_MAJOR_VERSION=${{ matrix.postgresMajorVersion }}
            POSTGIS_MAJOR_VERSION=${{ matrix.postgisMajorVersion }}
            POSTGIS_MINOR_VERSION=${{ matrix.postgisMinorRelease }}
          cache-from: |
            type=gha,scope=prod
          #cache-to: type=gha,scope=prod
          target: postgis-prod

  publish_release_artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      github.actor != 'dependabot[bot]' &&
      !(
        contains(github.event.pull_request.title, '[skip-release]') ||
        contains(github.event.comment.body, '/skiprelease') 
      ) &&  github.event.workflow_run.conclusion == 'success'
    needs: [ deploy-image ]
    strategy:
      matrix:
        postgresMajorVersion:
          - 18
        postgisMajorVersion:
          - 3
        postgisMinorRelease:
          - 6
    steps:
      - name: Checkout code
        id: git_checkout
        uses: actions/checkout@v6
        with:
          ref: 'develop'

      - name: Get Current Date
        id: current_date
        run: echo "formatted=$(date -u +%Y.%m.%d)" >> $GITHUB_OUTPUT

      - name: Get Latest Commit Hash
        id: latest_commit_hash
        run: echo "commit=$(git rev-parse --short "$GITHUB_SHA")" >> $GITHUB_OUTPUT

      - name: publish_release
        id: tag_releases
        run: |
          gh release create v${{ matrix.postgresMajorVersion }}.${{ matrix.postgisMajorVersion }}.${{ matrix.postgisMinorRelease }}--v${{ steps.current_date.outputs.formatted }}--${{ steps.latest_commit_hash.outputs.commit }} --notes ${{ steps.latest_commit_hash.outputs.commit }} --target develop --repo $GITHUB_REPOSITORY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
